name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
        env:
          NODE_ENV: development

      - run: npm run bundle

      - name: Compile standalone binary
        run: bun build dist/cli.bundle.js --compile --outfile=mer2excal-darwin-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: mer2excal-darwin-${{ matrix.arch }}
          path: mer2excal-darwin-${{ matrix.arch }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mer2excal-darwin-${{ matrix.arch }}
