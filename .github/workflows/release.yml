name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run bundle

      - name: Build executables
        run: |
          bun build dist/cli.bundle.js --compile --target=bun-darwin-arm64 --outfile=mer2excal-darwin-arm64
          bun build dist/cli.bundle.js --compile --target=bun-darwin-x64 --outfile=mer2excal-darwin-x64
          bun build dist/cli.bundle.js --compile --target=bun-windows-x64 --outfile=mer2excal-windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mer2excal-darwin-arm64
            mer2excal-darwin-x64
            mer2excal-windows-x64.exe
          generate_release_notes: true
